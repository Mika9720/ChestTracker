
name: Construire Chest Tracker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: unzip -q ChestTracker_Android_Mobile_Build.zip -d buildsrc

      - name: Construire APK
        working-directory: buildsrc/ChestTrackerAndroid
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChestTracker-APK
          path: buildsrc/ChestTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
